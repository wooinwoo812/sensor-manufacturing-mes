name: sensor-manufacturing-mes

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sensor_mes}
      POSTGRES_USER: ${POSTGRES_USER:-sensor_mes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensor_mes_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-sensor_mes} -d ${POSTGRES_DB:-sensor_mes}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
