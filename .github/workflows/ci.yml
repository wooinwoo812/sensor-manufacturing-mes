name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Code and documentation quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://sensor_mes:sensor_mes_local@localhost:5432/sensor_mes?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Verify PostgreSQL connection
        run: pnpm db:check

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed and verify demo authentication
        run: pnpm db:seed && pnpm db:verify-auth

      - name: Lint source
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify production flow against PostgreSQL
        run: pnpm test:postgres

      - name: Build applications
        run: pnpm build

      - name: Check documentation
        run: pnpm docs:check

      - name: Check deployment scripts
        run: |
          bash -n deploy/lightsail/package-release.sh
          bash -n deploy/lightsail/deploy-release.sh
          bash -n deploy/lightsail/github-deploy.sh
          shellcheck deploy/lightsail/*.sh
          python3 deploy/lightsail/test_deploy.py

      - name: Package the verified release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash deploy/lightsail/package-release.sh "$RUNNER_TEMP/release.tar.gz"

      - name: Save deployment artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightsail-release
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes

  deploy:
    name: Deploy to Lightsail
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      LIGHTSAIL_INSTANCE: fabriscope-mes
      AWS_PAGER: ""
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the verified release
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lightsail-release
          path: ${{ runner.temp }}/release

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.LIGHTSAIL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
          role-duration-seconds: 1800
          allowed-account-ids: "017947000500"

      - name: Deploy and verify HTTPS
        run: bash deploy/lightsail/github-deploy.sh "$RUNNER_TEMP/release/release.tar.gz"

      - name: Close temporary SSH access
        if: always()
        run: |
          rule="$RUNNER_TEMP/lightsail-ssh-rule.json"
          if [ -s "$rule" ]; then
            aws lightsail close-instance-public-ports \
              --instance-name "$LIGHTSAIL_INSTANCE" \
              --port-info "file://$rule" --output json > /dev/null
          fi
