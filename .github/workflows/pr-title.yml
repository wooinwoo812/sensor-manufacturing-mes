name: PR governance

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit style
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const pattern = /^(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z0-9].+$/;

          if (!pattern.test(title) || title.length > 90) {
            console.error("PR title must follow Conventional Commits and be at most 90 characters.");
            console.error("Example: feat(production): implement work-order lifecycle");
            process.exit(1);
          }

          console.log(`Valid PR title: ${title}`);
          NODE
