name: Spike
description: 불확실한 기술·도메인 질문을 시간 제한 안에 조사합니다.
title: "spike: "
labels:
  - "type: spike"
  - "status: triage"
body:
  - type: textarea
    id: question
    attributes:
      label: 결정할 질문
      description: 조사 후 반드시 답해야 하는 질문을 하나로 좁혀 주세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 배경과 제약
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: "예: 4시간"
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 비교할 선택지와 판단 기준
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 완료 산출물
      placeholder: "ADR, 프로토타입, 측정 결과, 후속 Issue"
    validations:
      required: true
  - type: checkboxes
    id: done
    attributes:
      label: 완료 기준
      options:
        - label: 채택·기각·추가조사 중 하나의 결론을 남깁니다.
          required: true
        - label: 프로토타입 코드는 제품 코드로 바로 병합하지 않습니다.
          required: true
