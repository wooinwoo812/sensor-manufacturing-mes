name: Feature
description: 사용자 가치와 완료 조건이 명확한 기능을 제안합니다.
title: "feat: "
labels:
  - "type: feature"
  - "status: triage"
body:
  - type: dropdown
    id: actor
    attributes:
      label: 사용자 역할
      options:
        - 생산계획 담당자
        - 현장 작업자
        - 자재 담당자
        - 품질 담당자
        - 시스템 관리자
        - 시스템 또는 외부 연동
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 현재 누가 어떤 상황에서 무엇 때문에 어려운지 작성해 주세요.
      placeholder: "생산계획 담당자는 ... 때문에 ...을 판단하기 어렵다."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 기대 결과
      description: 구현 항목 대신 사용자가 얻게 될 결과를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 포함 범위
      placeholder: |
        - 포함할 업무 흐름
        - 포함할 화면 또는 API
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 비범위
      description: 이번 Issue에서 의도적으로 하지 않을 일을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] 오류·빈 상태·권한 차이가 명시된다.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: 도메인 규칙과 불변조건
      description: 이 기능이 깨뜨리면 안 되는 상태·수량·권한 규칙을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: data_ui
    attributes:
      label: 데이터·API·UI 영향
      description: schema, transaction, API contract, migration 및 UI 상태 영향을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 계획
      description: 단위·통합·E2E 테스트와 수동 확인 시나리오를 작성해 주세요.
    validations:
      required: true
  - type: checkboxes
    id: ready
    attributes:
      label: Ready 확인
      options:
        - label: 공개되지 않은 실제 기업 정보나 운영 데이터를 포함하지 않습니다.
          required: true
        - label: 미결정 사항을 Spike 또는 ADR로 분리했습니다.
          required: true
