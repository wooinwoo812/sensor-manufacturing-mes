name: fabriscope

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://sensor_mes:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sensor_mes?schema=public
  WEB_ORIGIN: https://${SITE_HOST:?Set SITE_HOST}
  DB_POOL_MAX: "5"

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sensor_mes
      POSTGRES_USER: sensor_mes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=30"]
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_mes -d sensor_mes"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: fabriscope-mes:local
    build:
      context: ../..
      dockerfile: deploy/lightsail/Dockerfile
      target: runtime
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST}
      GOMEMLIMIT: 64MiB
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  maintenance:
    profiles: ["tools"]
    image: fabriscope-mes-maintenance:local
    build:
      context: ../..
      dockerfile: deploy/lightsail/Dockerfile
      target: maintenance
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
